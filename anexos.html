    <!-- MODELO: troque o src abaixo pela imagem que você quiser -->
    <div class="centralizaranexos">
        <img id="anexo-img" src="./img/" alt="Anexo">
        <p id="anexo-em-breve" class="em-breve card-anexo" hidden>Em breve</p>
    </div>

    <script>
        const anexoImg = document.getElementById('anexo-img');
        const anexoEmBreve = document.getElementById('anexo-em-breve');

        function mostrarEmBreve() {
            anexoImg.hidden = true;
            anexoEmBreve.hidden = false;
        }

        if (!anexoImg.getAttribute('src') || anexoImg.getAttribute('src').trim() === './img/') {
            mostrarEmBreve();
        } else {
            anexoImg.addEventListener('error', mostrarEmBreve);
        }
    </script>
</body>
